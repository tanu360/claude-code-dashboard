services:
  dashboard:
    build: .
    ports:
      - "3300:11111"
    environment:
      - NODE_ENV=production
      - PORT=11111
      - HOSTNAME=0.0.0.0
      - HOME=/home/nextjs
    volumes:
      # ccusage reads Claude Code JSONL usage from ~/.claude/projects.
      # Mount the whole Claude config read-only so Docker sees the same data as local ccusage.
      - ~/.claude:/home/nextjs/.claude:ro
    restart: unless-stopped
